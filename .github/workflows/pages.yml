name: Deploy homepage

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Serve the whole repository tree (sub-pages like iccv17/ are linked
      # from pubs.html); .git and CI config are not part of the site.
      - name: Stage site files
        run: |
          mkdir _site
          tar -cf - --exclude=./.git --exclude=./_site --exclude=./.github . | tar -xf - -C _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
