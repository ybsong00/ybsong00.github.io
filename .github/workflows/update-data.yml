name: Update homepage data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-homepage-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # continue-on-error only keeps one dead source from blocking the other.
      # "Report source status" re-checks the raw outcomes below so a failure
      # still turns the run red instead of passing silently for weeks.
      - name: Fetch Google Scholar citation count
        id: citations
        run: python scripts/update_citations.py
        continue-on-error: true

      - name: Fetch Hugging Face trending tokens
        id: tokens
        run: python scripts/update_tokens.py
        continue-on-error: true

      - name: Commit updated data
        id: commit
        run: |
          if [ -f citations.json ]; then git add citations.json; fi
          if [ -f tokens.json ]; then git add tokens.json; fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update citations and trending tokens"
          # checkout runs in detached HEAD, so push explicitly to master
          git push origin HEAD:refs/heads/master
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN never triggers other workflows, so the
      # Pages deploy must be requested explicitly or the new data is committed
      # but never actually served.
      - name: Redeploy Pages
        if: steps.commit.outputs.pushed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: 'master',
            })

      - name: Report source status
        if: always()
        env:
          CITATIONS: ${{ steps.citations.outcome }}
          TOKENS: ${{ steps.tokens.outcome }}
        run: |
          {
            echo "## Homepage data sources"
            echo ""
            echo "| Source | Outcome |"
            echo "| --- | --- |"
            echo "| Google Scholar citations | $CITATIONS |"
            echo "| Hugging Face trending tokens | $TOKENS |"
            echo ""
            echo "The precise failure reason is in each failed step's annotation."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CITATIONS" != "success" ] || [ "$TOKENS" != "success" ]; then
            echo "At least one data source failed."
            exit 1
          fi
