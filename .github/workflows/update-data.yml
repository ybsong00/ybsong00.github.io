name: Update homepage data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Seed the rolling lexicon from this many previous days of papers"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: update-homepage-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # continue-on-error keeps one dead source from blocking the other and from
      # blocking the commit. "Report source status" judges health on data
      # freshness rather than per-run outcome, so an intermittent Scholar miss
      # warns instead of failing the run every day.
      - name: Fetch Google Scholar citation count
        id: citations
        run: python scripts/update_citations.py
        continue-on-error: true

      - name: Fetch Hugging Face trending tokens
        id: tokens
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
        run: python scripts/update_tokens.py
        continue-on-error: true

      - name: Commit updated data
        id: commit
        run: |
          if [ -f citations.json ]; then git add citations.json; fi
          if [ -f tokens.json ]; then git add tokens.json; fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update citations and trending tokens"
          # checkout runs in detached HEAD, so push explicitly to master
          git push origin HEAD:refs/heads/master
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN never triggers other workflows, so the
      # Pages deploy must be requested explicitly or the new data is committed
      # but never actually served.
      - name: Redeploy Pages
        if: steps.commit.outputs.pushed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: 'master',
            })

      - name: Report source status
        if: always()
        env:
          CITATIONS: ${{ steps.citations.outcome }}
          TOKENS: ${{ steps.tokens.outcome }}
        run: |
          # Scholar rejects datacenter IPs intermittently and the script keeps the
          # last good value, so a single miss is noise. Sustained staleness is not.
          stale_days=$(python -c "import json,pathlib,datetime;p=pathlib.Path('citations.json');print(9999 if not p.exists() else (datetime.datetime.now(datetime.timezone.utc).date()-datetime.date.fromisoformat(json.loads(p.read_text())['updated'])).days)" 2>/dev/null || echo 9999)

          {
            echo "## Homepage data sources"
            echo ""
            echo "| Source | This run | Note |"
            echo "| --- | --- | --- |"
            echo "| Google Scholar citations | $CITATIONS | citations.json is ${stale_days}d old |"
            echo "| Hugging Face trending tokens | $TOKENS | updated daily |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TOKENS" != "success" ]; then
            echo "::error title=Data pipeline::Hugging Face token fetch failed. This source has been reliable, so investigate."
            exit 1
          fi

          if [ "$stale_days" -gt 7 ]; then
            echo "::error title=Data pipeline::citations.json is ${stale_days} days old. Scholar has been unreachable for over a week; consider switching source."
            exit 1
          fi

          if [ "$CITATIONS" != "success" ]; then
            echo "::warning title=Data pipeline::Scholar rejected this run (expected intermittently from datacenter IPs). Keeping the previous count; citations.json is ${stale_days}d old."
          fi
